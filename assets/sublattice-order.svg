<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" role="img" aria-labelledby="title desc"><title id="title">Same composition, different sublattice order</title><desc id="desc">Each constructed pattern has eight sites, four A and four B. Left: two A on each sublattice, eta zero. Right: all four A on alpha and all four B on beta, eta one. Positions depict labelled site groups, not a spatial projection of a crystal.</desc><rect width="900" height="450" rx="14" fill="#101827"/><text x="40" y="46" fill="#e6edf3" font-size="21" font-family="sans-serif">No sublattice bias: eta = 0</text><text x="40" y="90" fill="#bbc7dc" font-size="18" font-family="sans-serif">alpha sites</text><circle cx="72" cy="125" r="26" fill="#7dd3fc"/><text x="72" y="132" text-anchor="middle" fill="#101827" font-size="23" font-family="sans-serif">A</text><circle cx="157" cy="125" r="26" fill="#7dd3fc"/><text x="157" y="132" text-anchor="middle" fill="#101827" font-size="23" font-family="sans-serif">A</text><circle cx="242" cy="125" r="26" fill="#f5a97f"/><text x="242" y="132" text-anchor="middle" fill="#101827" font-size="23" font-family="sans-serif">B</text><circle cx="327" cy="125" r="26" fill="#f5a97f"/><text x="327" y="132" text-anchor="middle" fill="#101827" font-size="23" font-family="sans-serif">B</text><text x="40" y="195" fill="#bbc7dc" font-size="18" font-family="sans-serif">beta sites</text><circle cx="72" cy="230" r="26" fill="#7dd3fc"/><text x="72" y="237" text-anchor="middle" fill="#101827" font-size="23" font-family="sans-serif">A</text><circle cx="157" cy="230" r="26" fill="#f5a97f"/><text x="157" y="237" text-anchor="middle" fill="#101827" font-size="23" font-family="sans-serif">B</text><circle cx="242" cy="230" r="26" fill="#7dd3fc"/><text x="242" y="237" text-anchor="middle" fill="#101827" font-size="23" font-family="sans-serif">A</text><circle cx="327" cy="230" r="26" fill="#f5a97f"/><text x="327" y="237" text-anchor="middle" fill="#101827" font-size="23" font-family="sans-serif">B</text><text x="40" y="310" fill="#e6edf3" font-size="21" font-family="sans-serif">4 A + 4 B: atomic x_A = 1/2</text><text x="480" y="46" fill="#e6edf3" font-size="21" font-family="sans-serif">Perfect sublattice order: eta = 1</text><text x="480" y="90" fill="#bbc7dc" font-size="18" font-family="sans-serif">alpha sites</text><circle cx="512" cy="125" r="26" fill="#7dd3fc"/><text x="512" y="132" text-anchor="middle" fill="#101827" font-size="23" font-family="sans-serif">A</text><circle cx="597" cy="125" r="26" fill="#7dd3fc"/><text x="597" y="132" text-anchor="middle" fill="#101827" font-size="23" font-family="sans-serif">A</text><circle cx="682" cy="125" r="26" fill="#7dd3fc"/><text x="682" y="132" text-anchor="middle" fill="#101827" font-size="23" font-family="sans-serif">A</text><circle cx="767" cy="125" r="26" fill="#7dd3fc"/><text x="767" y="132" text-anchor="middle" fill="#101827" font-size="23" font-family="sans-serif">A</text><text x="480" y="195" fill="#bbc7dc" font-size="18" font-family="sans-serif">beta sites</text><circle cx="512" cy="230" r="26" fill="#f5a97f"/><text x="512" y="237" text-anchor="middle" fill="#101827" font-size="23" font-family="sans-serif">B</text><circle cx="597" cy="230" r="26" fill="#f5a97f"/><text x="597" y="237" text-anchor="middle" fill="#101827" font-size="23" font-family="sans-serif">B</text><circle cx="682" cy="230" r="26" fill="#f5a97f"/><text x="682" y="237" text-anchor="middle" fill="#101827" font-size="23" font-family="sans-serif">B</text><circle cx="767" cy="230" r="26" fill="#f5a97f"/><text x="767" y="237" text-anchor="middle" fill="#101827" font-size="23" font-family="sans-serif">B</text><text x="480" y="310" fill="#e6edf3" font-size="21" font-family="sans-serif">4 A + 4 B: atomic x_A = 1/2</text><text x="40" y="370" fill="#bbc7dc" font-size="19" font-family="sans-serif">Composition fixes the total count; order distinguishes the two site groups.</text><text x="40" y="410" fill="#bbc7dc" font-size="17" font-family="sans-serif">Constructed labelled-site groups; neither a micrograph nor a crystal projection.</text></svg>